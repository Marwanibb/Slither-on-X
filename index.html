<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Slither X</title>
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Slither X">
<meta name="twitter:description" content="Grow, fight bots and climb the leaderboard.">
<meta name="twitter:player" content="https://slither-on-x.vercel.app/">
<meta name="twitter:player:width" content="720">
<meta name="twitter:player:height" content="405">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:Inter,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}.panel{background:rgba(8,11,20,.84);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 45px rgba(0,0,0,.4);backdrop-filter:blur(10px);border-radius:14px}
#stats{position:absolute;left:14px;top:14px;padding:11px 14px;font-weight:800}.sub{font-size:11px;opacity:.55;margin-top:3px;font-weight:500}
#leader{position:absolute;right:14px;top:14px;width:205px;padding:12px 14px}.row{display:flex;justify-content:space-between;font-size:12px;margin-top:6px}
#bottom{position:absolute;left:14px;bottom:14px;padding:9px 12px;font-size:11px;opacity:.9}
#sound{position:absolute;right:14px;bottom:14px;width:105px;padding:9px 10px;color:#fff;background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;pointer-events:auto;cursor:pointer}
#overlay,#death{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.48);pointer-events:auto}
#death{display:none}.card{width:min(430px,calc(100% - 28px));padding:26px;text-align:center}.card h1{font-size:42px;letter-spacing:-2px;margin:0 0 4px}.card p{opacity:.62;font-size:13px;margin:0 0 20px}
input[type=text]{width:100%;padding:12px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0c;color:white;outline:0;margin-bottom:12px}
input[type=color]{width:58px;height:42px;padding:2px;border:1px solid #ffffff22;border-radius:9px;background:#111;vertical-align:middle;cursor:pointer}
.colorline{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:15px;font-size:13px;opacity:.85}
button.play{width:100%;padding:13px;border:0;border-radius:10px;background:#fff;color:#050505;font-weight:900;font-size:15px;cursor:pointer}
.small{font-size:11px;opacity:.5;margin-top:13px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
  <div id="stats" class="panel"><div id="length">Length 15</div><div id="rank">Rank #1</div><div class="sub">Mouse / WASD • SPACE = boost</div></div>
  <div id="leader" class="panel"><b>LEADERBOARD</b><div id="leaders"></div></div>
  <div id="bottom" class="panel">Eat glowing orbs • Avoid every snake's body</div>
  <button id="sound">🔊 Music</button>
</div>

<div id="overlay">
  <div class="card panel">
    <h1>SLITHER X</h1>
    <p>Grow your snake, destroy opponents and take #1.</p>
    <input id="name" type="text" maxlength="16" value="Player" placeholder="Name">
    <div class="colorline">Snake color <input id="color" type="color" value="#8b5cf6"></div>
    <button id="play" class="play">PLAY</button>
    <div class="small">Music starts after you press PLAY.</div>
  </div>
</div>

<div id="death">
  <div class="card panel">
    <h1>GAME OVER</h1><p id="final"></p>
    <button id="again" class="play">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay"),death=document.getElementById("death");
const play=document.getElementById("play"),again=document.getElementById("again");
const nameEl=document.getElementById("name"),colorEl=document.getElementById("color");
const lengthEl=document.getElementById("length"),rankEl=document.getElementById("rank");
const leadersEl=document.getElementById("leaders"),soundBtn=document.getElementById("sound");

let W=innerWidth,H=innerHeight,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const WORLD=5000, MAX_SNAKES=15;
const BOT_COLORS=["#22d3ee","#f43f5e","#f59e0b","#10b981","#e879f9","#60a5fa","#fb7185","#a3e635","#38bdf8","#f97316","#c084fc","#2dd4bf","#facc15","#ef4444"];
const foods=[];const snakes=[];
let player=null,running=false,last=0,mouse={x:W/2,y:H/2},keys={};

addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("touchmove",e=>{if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY}},{passive:true});
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")e.preventDefault()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function d2(a,b){const x=a.x-b.x,y=a.y-b.y;return x*x+y*y}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function createSnake(name,x,y,color,isPlayer){
  const s={name,x,y,color,isPlayer,alive:true,angle:rand(0,Math.PI*2),target:rand(0,Math.PI*2),
    speed:150,boost:false,r:12,mass:15,body:[],eatCooldown:0,aiTimer:0};
  for(let i=0;i<s.mass;i++)s.body.push({x:x-Math.cos(s.angle)*i*10,y:y-Math.sin(s.angle)*i*10});
  return s;
}

function addFood(x,y,value=1){
  foods.push({x:clamp(x,30,WORLD-30),y:clamp(y,30,WORLD-30),r:rand(3.5,6),value,color:Math.random()>.5?"#a78bfa":"#22d3ee",pulse:Math.random()*6.28});
}

function seedFood(n){
  for(let i=0;i<n;i++)addFood(rand(60,WORLD-60),rand(60,WORLD-60),1);
}

function reset(){
  snakes.length=0;foods.length=0;
  const chosenColor=colorEl.value||"#8b5cf6";
  player=createSnake((nameEl.value.trim()||"Player").slice(0,16),WORLD/2,WORLD/2,chosenColor,true);
  snakes.push(player);
  for(let i=0;i<MAX_SNAKES-1;i++){
    const s=createSnake("Bot "+(i+1),rand(400,WORLD-400),rand(400,WORLD-400),BOT_COLORS[i%BOT_COLORS.length],false);
    s.mass=Math.floor(rand(14,34));s.body=[];
    for(let j=0;j<s.mass;j++)s.body.push({x:s.x-Math.cos(s.angle)*j*10,y:s.y-Math.sin(s.angle)*j*10});
    snakes.push(s);
  }
  seedFood(900);
  running=true;overlay.style.display="none";death.style.display="none";
  last=performance.now();requestAnimationFrame(loop);
}

function dropFood(s){
  const amount=Math.min(70,Math.max(8,Math.floor(s.mass*.7)));
  for(let i=0;i<amount;i++){
    const p=s.body[Math.min(s.body.length-1,Math.floor(rand(0,s.body.length)))];
    addFood(p.x+rand(-35,35),p.y+rand(-35,35),1);
  }
}

function findTargetFood(s){
  let best=null,bestD=Infinity;
  for(const f of foods){
    const dd=d2(s,f);
    if(dd<bestD&&dd<650*650){best=f;bestD=dd}
  }
  return best;
}

function steer(s,dt){
  if(s.isPlayer){
    let dx=mouse.x-W/2,dy=mouse.y-H/2;
    if(Math.hypot(dx,dy)>10)s.target=Math.atan2(dy,dx);
    if(keys["w"]||keys["arrowup"])s.target=-Math.PI/2;
    if(keys["s"]||keys["arrowdown"])s.target=Math.PI/2;
    if(keys["a"]||keys["arrowleft"])s.target=Math.PI;
    if(keys["d"]||keys["arrowright"])s.target=0;
    s.boost=!!(keys[" "]||keys["space"])&&s.mass>18;
  }else{
    s.aiTimer-=dt;
    if(s.aiTimer<=0){
      s.aiTimer=rand(.15,.5);
      const f=findTargetFood(s);
      if(f)s.target=Math.atan2(f.y-s.y,f.x-s.x);
      else s.target+=rand(-.8,.8);
      // avoid arena edge
      const edge=300;
      if(s.x<edge)s.target=rand(-.4,.8);
      if(s.x>WORLD-edge)s.target=rand(2.3,3.8);
      if(s.y<edge)s.target=rand(.5,2.6);
      if(s.y>WORLD-edge)s.target=rand(-2.6,-.5);
      // avoid nearby larger snake heads
      for(const o of snakes){
        if(o!==s&&o.alive&&o.mass>s.mass&&d2(s,o)<300*300){
          s.target=Math.atan2(s.y-o.y,s.x-o.x);break;
        }
      }
    }
    s.boost=false;
  }

  let diff=Math.atan2(Math.sin(s.target-s.angle),Math.cos(s.target-s.angle));
  const turn=3.0*dt;s.angle+=clamp(diff,-turn,turn);
  const speed=s.speed*(s.boost?1.65:1);
  s.x=clamp(s.x+Math.cos(s.angle)*speed*dt,35,WORLD-35);
  s.y=clamp(s.y+Math.sin(s.angle)*speed*dt,35,WORLD-35);

  // Continuous body: one segment is created for every movement step.
  s.body.unshift({x:s.x,y:s.y});
  const wanted=Math.max(10,Math.floor(s.mass));
  while(s.body.length<wanted){
    const tail=s.body[s.body.length-1];s.body.push({x:tail.x,y:tail.y});
  }
  while(s.body.length>wanted)s.body.pop();

  // Boost consumes mass slowly.
  if(s.boost&&s.mass>18&&Math.random()<dt*5){
    s.mass-=.12;
    if(s.body.length>Math.floor(s.mass))s.body.pop();
    if(Math.random()<.45)addFood(s.x+rand(-10,10),s.y+rand(-10,10),1);
  }
}

function eatFood(){
  for(const s of snakes){
    if(!s.alive)continue;
    for(let i=foods.length-1;i>=0;i--){
      const f=foods[i];
      if(d2(s.body[0],f)<(s.r+f.r+5)**2){
        foods.splice(i,1);
        // Each orb visibly grows the snake.
        s.mass+=f.value*1.35;
        // respawn one orb so the arena stays populated
        addFood(rand(60,WORLD-60),rand(60,WORLD-60),1);
      }
    }
  }
}

function kill(s){
  if(!s.alive)return;
  s.alive=false;dropFood(s);
  if(s.isPlayer){
    running=false;
    document.getElementById("final").textContent="You reached length "+Math.floor(s.mass)+".";
    death.style.display="flex";
    music.stop();
  }
}

function checkCollisions(){
  for(const s of snakes){
    if(!s.alive)continue;
    // self collision
    for(let i=22;i<s.body.length;i++){
      if(d2(s.body[0],s.body[i])<(s.r*1.35)**2){kill(s);break}
    }
    if(!s.alive)continue;
    // snake vs snake
    outer:for(const o of snakes){
      if(o===s||!o.alive)continue;
      for(let i=5;i<o.body.length;i++){
        if(d2(s.body[0],o.body[i])<(s.r*1.22)**2){kill(s);break outer}
      }
    }
  }
}

function updateLeaderboard(){
  const alive=snakes.filter(s=>s.alive).sort((a,b)=>b.mass-a.mass);
  const idx=alive.indexOf(player);
  lengthEl.textContent="Length "+Math.floor(player?.mass||0);
  rankEl.textContent="Rank #"+(idx<0?"—":idx+1);
  leadersEl.innerHTML=alive.slice(0,10).map((s,i)=>
    `<div class="row"><span>${i+1}. ${esc(s.name)}</span><b>${Math.floor(s.mass)}</b></div>`).join("");
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const camX=player?player.x:WORLD/2,camY=player?player.y:WORLD/2;
  const zoom=clamp(Math.min(W,H)/850,.65,1.15);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);

  ctx.fillStyle="#060a12";ctx.fillRect(0,0,WORLD,WORLD);
  ctx.strokeStyle="#202c42";ctx.lineWidth=12;ctx.strokeRect(25,25,WORLD-50,WORLD-50);
  ctx.strokeStyle="#101a2a";ctx.lineWidth=1;
  for(let x=0;x<=WORLD;x+=150){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke()}
  for(let y=0;y<=WORLD;y+=150){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke()}

  for(const f of foods){
    const pulse=1+Math.sin(performance.now()/240+f.pulse)*.18;
    ctx.globalAlpha=.85;ctx.fillStyle=f.color;ctx.shadowBlur=13;ctx.shadowColor=f.color;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  for(const s of snakes){
    if(!s.alive)continue;
    const len=s.body.length;
    for(let i=len-1;i>=0;i--){
      const p=s.body[i],t=i/Math.max(1,len-1);
      const r=s.r*(.62+.38*(1-t));
      ctx.globalAlpha=.45+.55*(1-t);
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    }
    const h=s.body[0];ctx.globalAlpha=1;
    ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(h.x,h.y,s.r+2,0,Math.PI*2);ctx.fill();
    // eyes
    for(const side of [-1,1]){
      const ex=h.x+Math.cos(s.angle+side*.42)*s.r*.46;
      const ey=h.y+Math.sin(s.angle+side*.42)*s.r*.46;
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(ex,ey,3.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#111";ctx.beginPath();ctx.arc(ex+Math.cos(s.angle)*1.1,ey+Math.sin(s.angle)*1.1,1.6,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

const music={
  ctx:null,master:null,playing:false,timer:null,step:0,
  start(){
    if(this.playing){if(this.ctx?.state==="suspended")this.ctx.resume();return}
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();this.master.gain.value=.20;this.master.connect(this.ctx.destination);
      this.playing=true;this.step=0;
      this.ctx.resume();
      this.timer=setInterval(()=>this.tick(),125);
    }catch(e){soundBtn.textContent="🔇 Audio unavailable"}
  },
  tick(){
    if(!this.ctx||this.ctx.state==="suspended")return;
    const t=this.ctx.currentTime,b=this.step%16;
    // kick
    if(b%4===0)this.tone(70,.13,.45,"sine");
    // bass
    const notes=[55,55,65.41,55,73.42,65.41,55,82.41];
    this.tone(notes[b%notes.length],.11,.16,"sawtooth");
    // bright offbeat
    if(b%2===1)this.tone(440,.045,.055,"square");
    this.step++;
  },
  tone(freq,dur,gain,type){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,this.ctx.currentTime);
    g.gain.setValueAtTime(.0001,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(gain,this.ctx.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+dur);
    o.connect(g).connect(this.master);o.start();o.stop(this.ctx.currentTime+dur+.02);
  },
  stop(){
    if(this.timer)clearInterval(this.timer);this.timer=null;this.playing=false;
  },
  toggle(){
    if(!this.ctx){this.start();return}
    if(this.ctx.state==="running"){this.ctx.suspend();soundBtn.textContent="🔇 Music"}
    else{this.ctx.resume();soundBtn.textContent="🔊 Music"}
  }
};

play.onclick=()=>{music.start();reset()};
again.onclick=()=>{music.start();reset()};
soundBtn.onclick=()=>music.toggle();

function loop(t){
  if(!running)return;
  const dt=Math.min(.035,Math.max(.001,(t-last)/1000));last=t;
  for(const s of snakes)if(s.alive)steer(s,dt);
  eatFood();checkCollisions();updateLeaderboard();draw();
  requestAnimationFrame(loop);
}
draw();
})();
</script>
</body>
</html>
