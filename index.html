<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slither X</title>
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Slither X">
<meta name="twitter:description" content="Grow your snake, battle bots and climb the leaderboard.">
<meta name="twitter:player" content="https://slither-on-x.vercel.app/">
<meta name="twitter:player:width" content="720">
<meta name="twitter:player:height" content="405">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;color:#fff;font-family:Arial,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(circle at 50% 45%,#111a2a 0,#060910 58%,#020307 100%)}
#hud{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:rgba(8,11,19,.82);border:1px solid rgba(255,255,255,.12);border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 12px 40px #0008}
#top{position:absolute;top:14px;left:14px;padding:10px 14px;font-weight:700}.small{font-size:12px;opacity:.65;font-weight:500}
#board{position:absolute;top:14px;right:14px;padding:12px 16px;min-width:180px}.row{display:flex;justify-content:space-between;gap:18px;font-size:13px;margin:4px 0}
#controls{position:absolute;left:14px;bottom:14px;padding:10px 12px;font-size:12px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.card{width:min(430px,calc(100% - 28px));padding:26px;text-align:center}.card h1{margin:0 0 6px;font-size:42px}.card p{opacity:.7;margin:0 0 20px}
input,button{font:inherit}input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0c;color:#fff;margin-bottom:12px}
button{border:0;border-radius:10px;padding:12px 20px;background:#fff;color:#000;font-weight:800;cursor:pointer;width:100%}
#dead{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.48)}
#dead .card{display:block}.stat{font-size:18px;margin:10px 0 18px}
#mute{position:absolute;bottom:14px;right:14px;width:auto;padding:9px 12px;background:#ffffff12;color:#fff;border:1px solid #fff2}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="top" class="panel"><div id="score">Length: 12</div><div class="small">WASD / mouse • Hold space to boost</div></div>
  <div id="board" class="panel"><b>LEADERBOARD</b><div id="leaders"></div></div>
  <div id="controls" class="panel">Move: mouse / WASD &nbsp; Boost: SPACE</div>
  <button id="mute">🔊 Sound</button>
  <div id="start"><div class="card panel">
    <h1>SLITHER X</h1><p>Grow your snake. Outsmart the bots. Take the #1 spot.</p>
    <input id="name" maxlength="16" value="Player" placeholder="Your name">
    <button id="play">PLAY</button>
  </div></div>
  <div id="dead"><div class="card panel"><h1>Game Over</h1><div id="final" class="stat"></div><button id="again">PLAY AGAIN</button></div></div>
</div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const start=document.getElementById('start'),dead=document.getElementById('dead');
const play=document.getElementById('play'),again=document.getElementById('again');
const nameInput=document.getElementById('name'),scoreEl=document.getElementById('score'),leadersEl=document.getElementById('leaders'),muteBtn=document.getElementById('mute');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const WORLD=4200, foods=[], snakes=[]; let player=null,running=false,last=0,mouse={x:W/2,y:H/2},keys={};
const colors=['#7c3aed','#22d3ee','#f43f5e','#f59e0b','#10b981','#e879f9','#60a5fa','#fb7185','#a3e635','#38bdf8','#f97316','#c084fc','#2dd4bf','#facc15'];

addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function makeSnake(name,x,y,color,isPlayer=false){
  const s={name,x,y,color,isPlayer,angle:rand(0,Math.PI*2),speed:150,r:11,body:[],target:rand(0,Math.PI*2),boost:false,alive:true};
  for(let i=0;i<12;i++)s.body.push({x:x-Math.cos(s.angle)*i*9,y:y-Math.sin(s.angle)*i*9});
  return s;
}
function reset(){
  snakes.length=0;foods.length=0;
  player=makeSnake((nameInput.value.trim()||'Player').slice(0,16),WORLD/2,WORLD/2,colors[0],true);
  snakes.push(player);
  for(let i=0;i<14;i++){
    let s=makeSnake('Bot '+(i+1),rand(300,WORLD-300),rand(300,WORLD-300),colors[(i+1)%colors.length]);
    snakes.push(s);
  }
  for(let i=0;i<650;i++)spawnFood(rand(80,WORLD-80),rand(80,WORLD-80));
  running=true;start.style.display='none';dead.style.display='none';last=performance.now();requestAnimationFrame(loop);
}
function spawnFood(x,y){foods.push({x,y,r:rand(3,6),color:colors[Math.floor(rand(0,colors.length))]})}
function dropFood(s){for(let i=0;i<Math.min(30,Math.floor(s.body.length/2));i++)spawnFood(s.body[i].x+rand(-25,25),s.body[i].y+rand(-25,25))}
function steer(s,dt){
  if(s.isPlayer){
    let dx=mouse.x-W/2,dy=mouse.y-H/2;
    if(Math.abs(dx)+Math.abs(dy)>12)s.target=Math.atan2(dy,dx);
    if(keys['w']||keys['arrowup'])s.target=-Math.PI/2;
    if(keys['s']||keys['arrowdown'])s.target=Math.PI/2;
    if(keys['a']||keys['arrowleft'])s.target=Math.PI;
    if(keys['d']||keys['arrowright'])s.target=0;
    s.boost=keys[' ']||keys['space'];
  }else{
    if(Math.random()<.015)s.target+=rand(-1.3,1.3);
    const margin=500;
    if(s.x<margin)s.target=rand(-.5,.5); if(s.x>WORLD-margin)s.target=rand(2.6,3.7);
    if(s.y<margin)s.target=rand(.2,2.9); if(s.y>WORLD-margin)s.target=rand(-2.9,-.2);
    s.boost=false;
  }
  let diff=Math.atan2(Math.sin(s.target-s.angle),Math.cos(s.target-s.angle));
  s.angle+=Math.max(-3.2*dt,Math.min(3.2*dt,diff));
  const sp=s.speed*(s.boost?1.55:1);
  s.x=Math.max(35,Math.min(WORLD-35,s.x+Math.cos(s.angle)*sp*dt));
  s.y=Math.max(35,Math.min(WORLD-35,s.y+Math.sin(s.angle)*sp*dt));
  const head={x:s.x,y:s.y}; s.body.unshift(head);
  const wanted=12+s.body.length*0.0; let maxLen=12+Math.floor(s.body.length/100);
  if(s.boost && s.body.length>14 && Math.random()<.12){s.body.pop();spawnFood(s.x+rand(-8,8),s.y+rand(-8,8))}
  while(s.body.length<maxLen) s.body.push({x:s.body[s.body.length-1].x,y:s.body[s.body.length-1].y});
  while(s.body.length>maxLen)s.body.pop();
}
function collisions(){
  for(const s of snakes)if(s.alive){
    for(let i=0;i<foods.length;i++)if(dist(s,foods[i])<s.r+foods[i].r+5){
      foods.splice(i,1);i--;s.body.push({x:s.body.at(-1).x,y:s.body.at(-1).y});spawnFood(rand(80,WORLD-80),rand(80,WORLD-80));
    }
    // self collision
    for(let i=14;i<s.body.length;i++)if(dist(s.body[0],s.body[i])<s.r*1.35){kill(s);break}
    if(!s.alive)continue;
    for(const o of snakes)if(o!==s&&o.alive){
      for(let i=3;i<o.body.length;i++)if(dist(s.body[0],o.body[i])<s.r*1.25){kill(s);break}
      if(!s.alive)break;
    }
  }
}
function kill(s){
  if(!s.alive)return;s.alive=false;dropFood(s);
  if(s.isPlayer){
    running=false;document.getElementById('final').textContent='Length: '+s.body.length;
    dead.style.display='flex';
  }
}
function updateBoard(){
  const arr=snakes.filter(s=>s.alive).sort((a,b)=>b.body.length-a.body.length).slice(0,8);
  leadersEl.innerHTML=arr.map((s,i)=>'<div class="row"><span>'+ (i+1)+'. '+esc(s.name)+'</span><b>'+s.body.length+'</b></div>').join('');
  scoreEl.textContent='Length: '+(player?.body.length||0);
}
function esc(x){return x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){
  ctx.clearRect(0,0,W,H);
  const camX=player?player.x:WORLD/2,camY=player?player.y:WORLD/2;
  const zoom=Math.min(W,H)/900;
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);
  // arena
  ctx.fillStyle='#080d16';ctx.fillRect(0,0,WORLD,WORLD);
  ctx.strokeStyle='#26324a';ctx.lineWidth=10;ctx.strokeRect(20,20,WORLD-40,WORLD-40);
  ctx.strokeStyle='#111b2c';ctx.lineWidth=1;
  for(let x=0;x<=WORLD;x+=140){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD);ctx.stroke()}
  for(let y=0;y<=WORLD;y+=140){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD,y);ctx.stroke()}
  for(const f of foods){ctx.beginPath();ctx.fillStyle=f.color;ctx.shadowBlur=12;ctx.shadowColor=f.color;ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
  for(const s of snakes.filter(x=>x.alive)){
    for(let i=s.body.length-1;i>=0;i--){
      const p=s.body[i],t=i/(s.body.length||1),r=s.r*(.72+.28*(1-t));
      ctx.beginPath();ctx.fillStyle=s.color;ctx.globalAlpha=.55+.45*(1-t);ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    const h=s.body[0];ctx.beginPath();ctx.fillStyle=s.color;ctx.arc(h.x,h.y,s.r+2,0,Math.PI*2);ctx.fill();
    const side=0.42,ex=s.r*.43,ey=s.r*.35;
    for(const q of [-1,1]){
      const exx=h.x+Math.cos(s.angle+q*side)*ex, eyy=h.y+Math.sin(s.angle+q*side)*ex;
      ctx.beginPath();ctx.fillStyle='#fff';ctx.arc(exx,eyy,3.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.fillStyle='#111';ctx.arc(exx+Math.cos(s.angle)*1.2,eyy+Math.sin(s.angle)*1.2,1.6,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}
function loop(now){
  if(!running)return; const dt=Math.min(.033,(now-last)/1000);last=now;
  for(const s of snakes)if(s.alive)steer(s,dt);
  collisions();updateBoard();draw();requestAnimationFrame(loop);
}
function startGame(){initAudio();reset()}
play.onclick=startGame;again.onclick=reset;

// tiny WebAudio synth: no external audio files, so it can never block game loading
let audioCtx=null,muted=false,timer=null;
function initAudio(){
  if(audioCtx){audioCtx.resume();return}
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let next=0,step=0;
    const gain=audioCtx.createGain();gain.gain.value=.045;gain.connect(audioCtx.destination);
    timer=setInterval(()=>{
      if(!audioCtx||muted)return;
      const now=audioCtx.currentTime;
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sawtooth';o.frequency.value=step%4===0?110:55;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.11);o.connect(g).connect(gain);o.start(now);o.stop(now+.12);step++;
    },125);
  }catch(e){}
}
muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?'🔇 Muted':'🔊 Sound';if(audioCtx)audioCtx.resume()}
})();
</script>
</body>
</html>
